<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIA PRO | Digital Scan</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #FFFFFF;
            font-family: 'Inter', sans-serif;
        }
        #canvas {
            display: block;
        }
        .ui-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            text-align: center;
            z-index: 10;
        }
        .interaction-zone {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 450px;
            height: 350px;
            cursor: crosshair;
            z-index: 20;
        }
        .hint {
            color: #154C71;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 5px;
            animation: pulse 2.5s infinite ease-in-out;
            margin-top: 220px;
            opacity: 0.9;
            /* Тінь змінена на світлу для ефекту світіння на білому */
            text-shadow: 0 0 10px rgba(21, 76, 113, 0.1);
        }
        @keyframes pulse {
            0%, 100% { opacity: 0.5; letter-spacing: 5px; }
            50% { opacity: 1; letter-spacing: 7px; }
        }
    </style>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.3"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
<body>
    <div class="ui-overlay">
        <div class="hint">VIA PRO // LIDAR SCANNING ACTIVE</div>
    </div>
    <div class="interaction-zone" id="trigger"></div>
    <canvas id="canvas"></canvas>
    <script type="module" src="index.tsx"></script>
<script type="module" src="/index.tsx"></script>
</body>
</html>
